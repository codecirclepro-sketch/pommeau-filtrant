# nginx site for pommeau-filtrant.fr, installed by deploy/setup-nginx.sh.
# certbot then adds the HTTPS (443) part and the redirect from http to the copy in /etc/nginx/sites-available.
# www is redirected to the bare domain by the app itself (next.config.ts).
server {
    listen 80;
    server_name pommeau-filtrant.fr www.pommeau-filtrant.fr;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
